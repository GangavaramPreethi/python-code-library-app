
services:
  db:
    image: gangavarampreethi/flm-python:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - myapp

  auth_service:
    image: gangavarampreethi/flm-python:auth
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - myapp
    depends_on:
      - db

  book_service:
    image: gangavarampreethi/flm-python:book
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - myapp
    depends_on:
      - db

  borrow_service:
    image: gangavarampreethi/flm-python:borrow
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - myapp
    depends_on:
      - db

  frontend:
    image: gangavarampreethi/flm-python:frontend
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - myapp
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  myapp:
     driver:bridge
   
volumes:
  mydata:
